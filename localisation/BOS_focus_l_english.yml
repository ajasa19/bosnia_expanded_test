 BOS_attack_the_heart_of_christianity:0 "Attack the Heart of Christianity"
 BOS_attack_the_heart_of_christianity_desc:0 "Attack the Heart of Christianity"
 BOS_the_two_mosques:0 "Liberate the Two Holy Mosques"
 BOS_the_two_mosques_desc:0 "Liberate the Two Holy Mosques"
 BOS_ways_of_the_old:0 "Ways of the Old"
 BOS_ways_of_the_old_desc:0 "The brief period of Austro-Hungarian rule brought political and technological advancements previously unseen in Bosnia. Perhaps the empire's experiment was cut short, and there is merit in revisiting the political ideals and institutions of that era."
 BOS_empower_united_muslim_organization:0 "Reinvite the United Muslim Organization"
 BOS_empower_united_muslim_organization_desc:0 "Once among the largest Bosnian political organizations under Habsburg rule, the United Muslim Organization has since fallen into political isolation. By welcoming its former members back into public life, we may revive its influence and restore its place in Bosnian politics."
 BOS_education_reform_n:0 "State Education Reform"
 BOS_education_reform_n_desc:0 "The first state-run schools were established under Austrian administration. If Bosnia is to continue on the path of development, more public schools must be built and compulsory education introduced for the younger generation."
 BOS_strengthen_democracy:0 "Strengthen Democratic Institutions"
 BOS_strengthen_democracy_desc:0 "Democracy can only endure when supported by strong institutions and an informed citizenry. The establishment of new government offices and public awareness campaigns will lay the foundations for a more stable democratic system."
 BOS_bosnian_identity:0 "The Bosnian Identity"
 BOS_bosnian_identity_desc:0 "The question of Bosnian national identity has long remained unresolved. We must continue the work left unfinished by the Austrians, promoting a shared Bosniak identity that unites our people not merely through faith, but through a common national consciousness."
 BOS_one_and_only:0 "Jedna si jedina"
 BOS_one_and_only_desc:0 "For far too long Bosnia was a pawn in the games of foreign powers. We must reject the notion of chaining our state to other nations, and instead embrace our own sovereignty and independence."
 BOS_illyrian_awkaning:0 "Illyrian Awakening"
 BOS_illyrian_awkaning_desc:0 "For far too long Bosnia was a pawn in the games of foreign powers. We must reject the notion of chaining our state to other nations, and instead embrace our own sovereignty and independence."
 BOS_the_illyrian_union:0 "The Illyrian Union"
 BOS_the_illyrian_union_desc:0 "The Illyrian Union"
 BOS_invite_croatia:0 "Invite Croatia"
 BOS_invite_croatia_desc:0 "It was not long ago Croats and us shared a common state, and we should not let that be forgotten. We should invite Croatia to join us in the Illyrian Union, and work together to bring glory to both states."
 BOS_invite_slovenia:0 "Invite Slovenia"
 BOS_invite_slovenia_desc:0 "The Slovenes may be distant from us, but they are still our brothers and sisters with shared history and culture. With their partnership, we can further strengthen the Illyrian Union and bring prosperity to our people."
 BOS_salona_conference:0 "Salona Conference"
 BOS_salona_conference_desc:0 "The establishment of the Illyrian Union is a historic moment but conflicting interests among the member states may threaten its stability. A conference in Salona will allow us to align our policies and ensure that the union remains unified and effective."
 BOS_reopen_old_wounds:0 "Reopen Old Wounds"
 BOS_reopen_old_wounds_desc:0 "It was due to the ideas of pan-Slavism that caused our state and people to almost vanish from the map. We must ensure to not let Pan-Slavism take root in our region again, and to do that we must crush the source of it across the Drina River."
 BOS_demand_the_return_of_coastal_territory:0 "Demand the Return of Coastal Territory"
 BOS_demand_the_return_of_coastal_territory_desc:0 "We must demand the return of the coastal territory that rightfully belongs to the Illyrian Union."
 BOS_reclaim_southern_Illyria:0 "Invite Albania to the Illyrian Union"
 BOS_reclaim_southern_Illyria_desc:0 "The Albanian were the historical southern reaches of Illyria. If we want to strengthen the validity of our union's title, we should invite them to join us."
 BOS_anti_colonialist_policy:0 "Anti Colonialist Policy"
 BOS_anti_colonialist_policy_desc:0 "Anti Colonialist Policy"
 BOS_liberate_muslims_under_anglo_rule:0 "Liberate Muslims Under Anglo Rule"
 BOS_liberate_muslims_under_anglo_rule_desc:0 "Liberate Muslims Under Anglo Rule"
