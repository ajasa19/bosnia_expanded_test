 BOS_new_bosnian_economy_desc:0 "New Bosnian Economy"
 BOS_form_arbih:0 "Form the ARBIH"
 BOS_form_arbih_desc:0 "The important part of every nation's survival is an armored force, and in order to secure the independence of our nation, we should form an army quick as we can."
 BOS_Army_Focus:0 "Army Focus"
 BOS_Army_Focus_desc:0 "Land Forces are the most important part of any army, and it always decides the winners in wars. We have to improve upon our land forces in order to come out victorious"
