 BOS_the_german_menace_desc:0 "The German Menace"
 BOS_the_atheist_menace:0 "The Atheist Menace"
 BOS_the_atheist_menace_desc:0 "The Atheist Menace"
 BOS_attack_the_heart_of_christianity:0 "Attack the Heart of Christianity"
 BOS_attack_the_heart_of_christianity_desc:0 "Attack the Heart of Christianity"
 BOS_the_two_mosques:0 "Liberate the Two Holy Mosques"
 BOS_the_two_mosques_desc:0 "Liberate the Two Holy Mosques"
 BOS_ways_of_the_old:0 "Ways of the Old"
 BOS_ways_of_the_old_desc:0 "Austro-Hungarian rule brought Bosnia railways, factories, schools, and modern institutions. Though the Empire has fallen, its legacy remains. Perhaps the Habsburg experiment was not a failure, but an unfinished undertaking from which we may yet learn."
 BOS_empower_united_muslim_organization:0 "Reinvite the United Muslim Organization"
 BOS_empower_united_muslim_organization_desc:0 "Once among Bosnia's most influential political movements, the United Muslim Organization has fallen into isolation. By welcoming its former members back into public life, we may restore its influence and strengthen our government."
 BOS_education_reform_n:0 "State Education Reform"
 BOS_education_reform_n_desc:0 "The Austrians laid the foundations of public education in Bosnia, but much remains unfinished. We must expand our schools and introduce compulsory education, ensuring that the next generation is prepared to build a prosperous nation."
 BOS_strengthen_democracy:0 "Strengthen Democratic Institutions"
 BOS_strengthen_democracy_desc:0 "A parliament alone cannot guarantee democracy. Strong institutions, an efficient civil service, and an informed population are essential. By strengthening our administration and encouraging political participation, we can secure Bosnia's democratic future."
 BOS_bosnian_identity:0 "The Bosnian Identity"
 BOS_bosnian_identity_desc:0 "Bosnia has long struggled to establish a common national identity. The Austrians once attempted to unite our people under a shared Bosnian identity. We must continue this work, placing our common homeland above religious and communal divisions."
 
 BOS_one_and_only:0 "Jedna si jedina"
 BOS_one_and_only_desc:0 "For too long, Bosnia has been a pawn of greater powers. Our interests have been sacrificed and our future decided abroad. Those days must end. Bosnia shall stand sovereign and independent, beholden to no foreign master."

 BOS_bosnian_awakening:0 "A Bosnian Awakening"
 BOS_bosnian_awakening_desc:0 "For generations, Bosnia has struggled to find its place among the nations of Europe. Now, the Bosnian people must rediscover their strength, pride, and common purpose. A new awakening is upon us."

 BOS_establish_old_connections:0 "Establish Old Connections"
 BOS_establish_old_connections_desc:0 "Bosnia cannot stand alone. Our history is deeply tied to the great powers of the Balkans. It is time to renew these ties and remind our neighbours that Bosnia can be a valuable friend and partner."

 BOS_travnik_convention:0 "The Travnik Convention"
 BOS_travnik_convention_desc:0 "Representatives of Bosnia's political and national movements gather in Travnik to discuss their homeland's future. It is time to set aside internal disagreements and establish a common vision for a sovereign Bosnia."

 BOS_respect_the_1909_borders:0 "Respect the 1909 Borders"
 BOS_respect_the_1909_borders_desc:0 "The borders established in the aftermath of the Bosnian Crisis of 1908 must be respected. Bosnia seeks no unnecessary expansion or foreign conflicts. Our priority must be defending the lands already under our control."

 BOS_sanjak_declaration:0 "The Sanjak Declaration"
 BOS_sanjak_declaration_desc:0 "The Bosnian Crisis of 1908 separated Bosnia from its lands in the Sanjak. This declaration will bring our claims before the world and make clear that Bosnia has not forgotten the injustices of 1908."

 BOS_seek_neighbouring_recognition:0 "Seek Neighbouring Recognition"
 BOS_seek_neighbouring_recognition_desc:0 "The borders of the Balkans remain uncertain. We must approach our neighbours and secure agreements that recognise our sovereignty and promote peaceful relations."

 BOS_seek_foreign_guarantees:0 "Seek Foreign Guarantees"
 BOS_seek_foreign_guarantees_desc:0 "Turkey and Hungary have longstanding ties to our homeland. Their guarantees could prove invaluable in protecting Bosnia during the uncertain years ahead."

 BOS_seek_alliances:0 "Seek Alliances"
 BOS_seek_alliances_desc:0 "Diplomatic guarantees alone cannot ensure our survival. An alliance with Berlin could secure Bosnia's position in the Balkans for generations to come."

 BOS_contact_sanjak_representatives:0 "Contact Sanjak Representatives"
 BOS_contact_sanjak_representatives_desc:0 "Declarations alone will not secure our ambitions. By establishing contact with Bosniak leaders in the Sanjak, we can build support for our territorial claims and future reunification."

 BOS_demand_sanjak:0 "Demand the Sanjak"
 BOS_demand_sanjak_desc:0 "Our claims to the Sanjak can no longer be ignored. We shall formally demand that Serbia surrender Montenegro's lands. Serbia must understand that rejecting our demands will mean war."

 BOS_receive_dalmation_representatives:0 "Receive Dalmatian Representatives"
 BOS_receive_dalmation_representatives_desc:0 "Our success in Montenegro has inspired other movements seeking independence. Representatives of the Dalmatian separatists have approached us, hoping to secure Bosnian support for their planned uprising."

 BOS_support_dalmatia:0 "Support Dalmatia"
 BOS_support_dalmatia_desc:0 "Dalmatian separatists await our commitment before declaring independence. We must prepare our armed forces to support their uprising and open a new front along the Una."

 BOS_decide_dalmatias_fate:0 "Decide Dalmatias Fate"
 BOS_decide_dalmatias_fate_desc:0 "With Croatia pushed back, Dalmatia stands free, but its future is still undecided. We can bind it to us as a loyal partner, or bring it fully into the Bosnian state."

 BOS_illyrian_awkaning:0 "Illyrian Awakening"
 BOS_illyrian_awkaning_desc:0 "The memory of ancient Illyria has endured through centuries of foreign rule. As nations rediscover their histories, we too must embrace our past. The Illyrian idea offers the foundation for a movement capable of uniting the peoples of our region."
 BOS_the_illyrian_union:0 "The Illyrian Union"
 BOS_the_illyrian_union_desc:0 "The peoples of the western Balkans have long been divided by foreign empires and artificial borders. Yet our shared interests remain. An Illyrian Union would provide the foundations for mutual defence, economic cooperation, and a common future."
 BOS_invite_croatia:0 "Invite Croatia"
 BOS_invite_croatia_desc:0 "Croats and Bosnians once shared a common Crown and many political institutions. Though the Empire has fallen, our historical ties remain. We should invite Croatia to join the Illyrian Union as an equal partner in our common undertaking."
 BOS_invite_slovenia:0 "Invite Slovenia"
 BOS_invite_slovenia_desc:0 "Our Slovenian neighbours share with us a history under the Habsburg Crown, as well as common political and economic traditions. Their inclusion would strengthen the Illyrian Union and extend its influence into Central Europe."
 BOS_salona_conference:0 "Salona Conference"
 BOS_salona_conference_desc:0 "The Illyrian Union has been established, but its survival cannot be taken for granted. We must convene our member states at Salona to settle disputes, coordinate policies, and establish the foundations of lasting cooperation."
 BOS_reopen_old_wounds:0 "Reopen Old Wounds"
 BOS_reopen_old_wounds_desc:0 "Pan-Slavism has repeatedly threatened to subordinate our independence to foreign ambitions. We cannot allow these ideas to endanger the Illyrian Union again. Across the Drina, their influence must be confronted before it grows beyond our control."
 BOS_reclaim_coastal_territory:0 "Reclaim Coastal Territory"
 BOS_reclaim_coastal_territory_desc:0 "The dissolution of Austria-Hungary brought an unjust partition of our historic lands. Italy, despite its costly and unimpressive performance in the Great War, was rewarded with territories it scarcely earned. We must reject this settlement and must restore our Adriatic borders."
 BOS_invite_albania:0 "Invite Albania"
 BOS_invite_albania_desc:0 "Albania occupies the southern reaches of the ancient Illyrian world. Its inclusion would strengthen our historical claims and extend the Union's influence. We must approach Tirana with an offer of partnership, prosperity, and mutual security."
 BOS_form_illyria:0 "Form Illyria"
 BOS_form_illyria_desc:0 "From the ruins of Austria-Hungary, Bosnia emerged fractured and uncertain. Through reform, consolidation, and a renewed embrace of our Illyrian heritage, we have become the centre of a growing alliance. Now, the time has come to unite our peoples beneath the banner of Illyria."
 
 BOS_dalmatia_independence_tt:0 "Dalmatia declares independence §Rboth Dalmatia and Bosnia will go to war with Croatia§!."