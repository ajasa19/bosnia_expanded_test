 BOS_assist_the_partisans:0 "The Alternative"
 BOS_assist_the_partisans_desc:0 "Perhaps centering ourselves around one ethnicity in the region will not end work, and would lead to more suffering. What we would really need is for all three people to stop hating each other and work together as one, united under humanity and not religion or ethhnicity, and only then can we become a powerful nation in this age."
 BOS_denounce_the_upper_class:0 "Denounce The Upper Class"
 BOS_denounce_the_upper_class_desc:0 "The Uper Class has always been suspicious in terms of how they sometimes treat their workers, as well as giving into bribes. We should not tolorate this anymore, Capitalism is based off of human greed and must be destroyed!"
 BOS_the_right_of_the_workers:0 "Right Of The Workers"
 BOS_the_right_of_the_workers_desc:0 "The most important part of any nation is the casual worker. Without him, many things could not be done in a country, but they are always treated so horribly. By improving their rights, it wil boost morale and overall production of the casual worker."
 BOS_the_sarajevo_march:0 "The Sarajevo March"
 BOS_the_sarajevo_march_desc:0 "The Government has abused it's people for far too long, it is now time to bring the glory of the revolution to Bosnia." 
 BOS_secure_the_new_state:0 "Secure the New State"
 BOS_secure_the_new_state_desc:0 "Now that we are ruling over the nation, we need to start implementing some quick reforms in order for the nation not to break up. "
 BOS_education_reform_c:0 "Education Reform"
 BOS_education_reform_c_desc:0 "By teaching the population socialist values, they will be more accepting of our ideology, as well as pave the way for better research capacities in the nation."
 BOS_the_destruction_of_nationalism:0 "Anti-Nationalist Rhetoric"
 BOS_the_destruction_of_nationalism_desc:0 "Nationalism and Fascism are a plague to every nation on earth, showcasing supremacy of one people over the other. We cannot tolerate these bastards any longer."
 BOS_integrate_socialist_economy:0 "Integrate The Socialist Economy"
 BOS_integrate_socialist_economy_desc:0 "It is about time we finally changed up our economic system to fit Socialist values, as well as integrate it into the nation."
 BOS_nationalize_the_banks:0 "Nationalize The Banks"
 BOS_nationalize_the_banks_desc:0 "Most Banks were under private ownership before we came into power, and it is now time to take that away and fully nationalize the banks of the nation."
 BOS_form_the_spb:0 "Formation of The SPB"
 BOS_form_the_spb_desc:0 "The younger generation is the future of every single nation that exists, and we need to make sure thatr this younger generation is loyal to the motherland."
 BOS_stalinist_doctrine:0 "Stalinist Doctrine"
 BOS_stalinist_doctrine_desc:0 "Tito's principles are weak, and Bosnia needs the doctrine of a powerful man who knows how to keep law and order in a nation."
 BOS_invite_the_marshal:0 "Invite The Marshal"
 BOS_invite_the_marshal_desc:0 "Tito is the only man able and experienced to lead a nation, his doctrine of brotherhood and unity is much needed in Bosnia to unite the people against nationalism. Death to Fascism and Freedom to the People!"
 BOS_glory_of_the_revolution:0 "Glory Of The Revolution"
 BOS_glory_of_the_revolution_desc:0 "It is our duty as a Socialist nation to spread its principles far and wide, and to liberate the workers from their opressors."
