l_english:
 BOS_sign_sarajevo_accords:0 "Sign the Sarajevo Accords"
 BOS_sign_sarajevo_accords_desc:0 "Being a new republic demands us to gurantee religious freedom for every citizen in Bosnia, having a very diverse religious group, signing the accords might bring more stabilisation to our nation."
 BOS_bmo_congress:0 "Hold the First BMO Congresss"
 BOS_bmo_congress_desc:0 "Holding the first congress of the BMO party will tighten its grip on the nation, and could lead to a pathway of direct democracy."
 BOS_establish_parliament:0 "Establish the Parliament"
 BOS_establish_parliament_desc:0 "The first steps of organizing democratic Bosnia, is by finally constructing a parliament, where our politicians can oppose or support certain choices, or for debates."
 BOS_religious_councils:0 "Religious Councils"
 BOS_religious_councils_desc:0 "Establishing councils for the Islamic, Catholic and Orthodox faith is gonna bring the three people closer together, and improve stability in the reguiin."
 BOS_bosnian_national_bank:0 "Bosnian National Bank"
 BOS_bosnian_national_bank_desc:0 "The Establishment of a National Bank is an important aspect for all of Bosnia's citizens, and it will bring more stability to the nation"
 BOS_economic_prosperity:0 "Economic Prosperity"
 BOS_economic_prosperity_desc:0 "Economic Liberty is very important for every democratic nation, enabling us to trade with one another and share our resources."
 BOS_democratic_forces:0 "Democratic Forces"
 BOS_democratic_forces_desc:0 "We are a young democratic nation in the Balkans, we are surrounded by Authoritarian Governments who take joy in opressing the ones below them, even going as far as to push that belief onto others. We need men who will be prepared to die for the liberty of our nation"
 BOS_universal_healthcare:0 "Universal Healthcare"
 BOS_universal_healthcare_desc:0 "One of the main problems of society is the fact that millions cannot afford basic healthcare, many people die just because they could not afford to pay for their treatment. Adopting Universal Healthcare will indeed be a high cost, but this is a law we have to pass for the people"
 BOS_corruption_crackdown:0 "Corruption Crackdown"
 BOS_corruption_crackdown_desc:0 "The time of Corruption shall come to an end in our nation, ever since our parliament was established, some rats have been working behind our backs by corrupting others and engaging in bribery, Mehmed Spaho has suggested a Corruption Crackdown policy to the government, which will help us stabilize the parliament"
 BOS_alignment_question:0 "Alignment Question"
 BOS_alignment_question_desc:0 "The biggest question that has been asked since our independence was the question on who we will align ourselves with, one delegation proposes neutrality while the other proposes joining the Allies"
 BOS_trust_in_the_west:0 "Trust In the West"
 BOS_trust_in_the_west_desc:0 "History has shown that we are not able to defend ourselves sometimes when encountering mighty nations, to ensure our survival we need to look for alliances, specifically in the west"
 BOS_proclaim_neutrality:0 "Proclaim Neutrality"
 BOS_proclaim_neutrality_desc:0 "War has shwon many times to be devastating for our nation, and that it keeps dividing our people more and more, as of this day forward we will proclaim neutrality and focus entirely on our problems, and not on the problems of others"
 BOS_improve_relations_with_britain:0 "Improve Relations with Britain"
 BOS_improve_relations_with_britain_desc:0 "Improve Relations with Britain"
 BOS_improve_relations_with_france:0 "Improve Relations with France"
 BOS_improve_relations_with_france_desc:0 "Improve Relations with France"
 BOS_join_the_allies:0 "Join the Allies"
 BOS_join_the_allies_desc:0 "No more shall our people be the subjects of other nations, and we will stand by our democratic friends in the west until the very end, combating everything that threatens the stability of the world, side by side"
 BOS_united_against_fascism:0 "United Against Fascism"
 BOS_united_against_fascism_desc:0 "Fascism has shown nothing more than be an opressive type of government that breaks many basic human rights, and it is our duty as a republic to denounce those practices, and not let those ideas step foot into our nation!"
 BOS_prepare_for_storm:0 "Preperation for the Storm"
 BOS_prepare_for_storm_desc:0 "It is not a secret that another great war is inevitable, and we shall be one foot ahead by preparing for the next global war, whenever it might get ignited "
 BOS_war_propaganda:0 "War Propaganda"
 BOS_war_propaganda_desc:0 "The world is burning, and the only way to ensure absolute victory over the enemy is by getting support of our population, by letting them know who their true enemy is, we will get their support in the war effort."
 BOS_discredit_the_accords:0 "Discredit the Sarajevo Accords"
 BOS_discredit_the_accords_desc:0 "Why should we abide by the suggestions of democracies and other western powers? Democracy has never worked in our region before, and our people would never et used to it. What Bosnia needs is an alternative way."
 BOS_bosna_zove:0 "Bosna Zove"
 BOS_bosna_zove_desc:0 "Bosniaks have been opressed throughout history, our ethnicity bashed and silenced. What Bosnia and Bosniaks need is a strong leader who will fight for the nation til the end, slaves we shall never be again!"
 BOS_ban_the_islamski_svijet:0 "Ban the Islamski Svijet"
 BOS_ban_the_islamski_svijet_desc:0 "The "Islamski Svijet" newspaper promotes Islamic Extremism which we cannot tolorate, even if we are Muslims ourselves. They seek to establish a Wahhabi Government in Bosnia and unite the people under Islam. They believe Faith is more important than the survival of a people"
 BOS_national_restoration:0 "National Restoration"
 BOS_national_restoration_desc:0 "Time for us Bosniaks to rise from the ashes, and tell everyone who we are, and make sure they will remember that for an eternity"
 BOS_ban_foreign_propaganda:0 "Ban Foreign Propaganda"
 BOS_ban_foreign_propaganda_desc:0 "Foreign National propaganda has always hurt our nation, as well as the Bosniak people overall. We need to ban these propagandas and focus on our own matter."
 BOS_establish_the_handzar_division:0 "Establish the Handzar Division"
 BOS_establish_the_handzar_division_desc:0 "Now that we formed our desired Bosniak state, we need to focus on establishing a Bosniak militia to keep the peace. Our state should establish this military wing of pure Bosniaks."
 BOS_bosniakism:0 "Bosniakism"
 BOS_bosniakism_desc:0 "Focusing on our region alone, as well as our own people is not good enough. We need to promote the Bosniak ethnicity far and wide, and integrate whoever defies our orders, people under our rule need to know which people are in charge."
 BOS_appeal_to_hitler:0 "Appeal to Germany"
 BOS_appeal_to_hitler_desc:0 "The German nation from the north is the current protector of the fascist ideology, and we need to learn to cooperate with other nations that share our ideology."
 BOS_sign_the_tripartite_pact:0 "Sign the Tripartite Pact"
 BOS_sign_the_tripartite_pact_desc:0 "Although we are following the true ideology, Bosnia alone is weak and not capable of much glory. For this reason we need to join the axis powers to truly have a chance to bring glory to our nation, as well as our people."
 BOS_bosnia_over_all:0 "Bosnia Over All"
 BOS_bosnia_over_all_desc:0 "Why should we depend on the forces of other nations? We may be weak, but not powerless. The Bosniak people need to learn to stand up for themselves without the guidance of foreign powers."
 BOS_serbian_question:0 "The Serbian Question"
 BOS_serbian_question_desc:0 "The Serbian population in our nation has always been causing trouble ever since the Bosniak state was born. We may have let them live peacefully for now, but it is about time we issue reforms regarding the Serbian people in our nation."
 BOS_proclaim_greater_bosnia:0 "Proclaim the Greater Bosniak State"
 BOS_proclaim_greater_bosnia_desc:0 "Our old land has been returned to us. It is now time for people to realize that Bosnia is not a little weak nation like before, for now it is time we truly rise from the ashes and tell the people who we really are."
 BOS_german_technological_sharing:0 "German Technological Sharing"
 BOS_german_technological_sharing_desc:0 "Germany has greatly advanced in terms of military technology, the kind of technology we are not yet able to achieve on our own. We should encourage technological sharing between our German brothers for the benefit of the entire Axis faction."
 BOS_revenge_for_opression:0 "Revenge for Opression"
 BOS_revenge_for_opression_desc:0 "The Yugoslav government had been opressing the Bosniak people ever since its creation, forcing us to identify as either Croats or Serbs. But now it is time for the Bosniak people to strike back against the opressors."
 BOS_balkan_domination:0 "Balkan Domination"
 BOS_balkan_domination_desc:0 "A unique opportunity has risen for us to dominate the Balkan peninsula as a Fascist nation. We should strive for domination over the region and show everyone what we are made of."
 BOS_request_albania:0 "Request Albania"
 BOS_request_albania_desc:0 "The Italians have annexed the weak Balkan nation of Albania not too long ago. But the region does not have much use for them, and it would bring more benefits to us. We will ask the Italians to hand over Albania to us."
 BOS_secure_greece:0 "Secure Greece"
 BOS_secure_greece_desc:0 "Our first step towards domination is taking out the nation of Greece to the south."
 BOS_avenge_the_kotromanic_family:0 "Avenge the Kotromanic Family"
 BOS_avenge_the_kotromanic_family_desc:0 "Bosnia had witnessed its worst days during the rule of the Ottoman Empire, our original culture was destroyed and replaced with a turkish one, as well as our entire royal family slaughtered. Time to take revenge upon the Turks for all the suffering they caused us."
 BOS_regional_stabilisation:0 "Regional Stabilisation"
 BOS_regional_stabilisation_desc:0 "Since our land holds many diverse ethnicities who strive for control over the nation, we need to focus on stabilizing the nation to realize the dream of a unified Bosnia."
 BOS_tuzla_conference:0 "Tuzla Conference"
 BOS_tuzla_conference_desc:0 "With the Ustase and Chetniks opposing our current government and wanting the nation to be part of their own state, it is time for the Bosnian delegation to meet in the city of Tuzla to discuss what to do with these rebels."
 BOS_deal_with_the_croats:0 "Prepare to deal with the Croats"
 BOS_deal_with_the_croats_desc:0 "The Croats have a much smaller number compared to the Serbs, meaning that the Ustase organization is not that popular or  organized as the Chetniks, so we should strike at them as soon as possible."
 BOS_deal_with_the_chetniks:0 "Prepare to deal with the Chetniks"
 BOS_deal_with_the_chetniks_desc:0 "The biggest thorn in our foot is the Chetnik movement, they are very organized and have upport from many local villages. We should crush them as soon as possible to bring stability back to the nation."
 BOS_operation_sloboda:0 "Operation Sloboda"
 BOS_operation_sloboda_desc:0 "Thee time has come to launch an operation against the chetnik movement, the nation shall be free from this scum!"
 BOS_root_out_the_ustase:0 "Root out the Ustase"
 BOS_root_out_the_ustase_desc:0 "Due to their low numbers, the Ustase should not be a problem to root out and put an end to. Many of their gatherings are public and not very secretive, but it is time to put an end to their opposition."
 BOS_the_bosnian_industry:0 "Bosnian Industry"
 BOS_the_bosnian_industry_desc:0 "Bosnia's economy remains predominantly agrarian and underdeveloped. Through industrialization, we must modernize production and lay the foundations for a stronger national economy."
 BOS_railroad_plan:0 "Bosanske Željeznice Expansion"
 BOS_railroad_plan_desc:0 "Bosnia's existing railway network is limited in both reach and capacity. Expanding our railways is essential to accelerating industrialization and connecting the nation's growing industries."
 BOS_expand_zenica_steel:0 "Expand the Zenica Steel Mill"
 BOS_expand_zenica_steel_desc:0 "Zenica is already an important centre of steel production. Expanding its existing facilities will increase industrial output and support Bosnia's continued industrialization."
 BOS_expand_brod_oil:0 "Expand the Bosanski Brod Oil Refinery"
 BOS_expand_brod_oil_desc:0 "The Hungarians left behind a modest oil refinery in Bosanski Brod. Expanding its facilities will strengthen our domestic refining capacity and support future industrial development."
