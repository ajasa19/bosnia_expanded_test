 #Bosnia
 chetnik_opposition:0 "Chetnik Resistance"
 chetnik_opposition_desc:0 "Throughout history many Serbs settled in Bosnia during the times of the Ottoman Empire, sadly it led to the creation of an ultra nationalist movement called the "Chetniks" who claim Bosnia as Serbian land, the movement is growing and has lead to many instabilities in the region"
 chetnik_opposition_2:0 "Chetnik Resistance"
 chetnik_opposition_3:0 "Crippling Chetnik Resistance"
 bosnian_army_2:0 "Over The Dinaric Alps"
 bosnian_army_2_desc:0 "Our nation is the heard of the Dinaric Alps, and our people have gotten used to the mountaineous terrain for generations to come. This gives us an advantage over foreign invaders who are not ready for harsh terrain, and in these circumstances we will always come out victorious and push them back. "
 croatian_nationalism:0 "Croatian Nationalism"
 croatian_nationalism_desc:0 "Just like the Serbs, the Croats have settled in Bosnia mainly during the times of the Austro Hungarian empire, and now their nationalists claim that Bosnia is rightful Croatian land"
