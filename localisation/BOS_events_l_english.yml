l_english:
 bosnia.1.t:0 "Chetniks raid factory"
 bosnia.1.d:0 "The chetniks have raided a local factory in our country, they broke some machines and damaged the building"
 bosnia.1.a:0 "Damnation"
 
 bosnia.2.t:0 "Murder in a village"
 bosnia.2.d:0 "The chetnik movement, in their aim for a Serbian Bosnia, killed a young Bosniak in a village, his body was found in the woods and locals are getting scared"
 bosnia.2.a:0 "They will pay for this"

 bosnia.3.t:0 "The Republic Has Been proclaimed"
 bosnia.3.d:0 "After many centuries of occupation from foreign powers, Bosnia and Herzegovina is finally a fully independent state, many Bosniaks have been looking forward for this day and finally got what their dream desired.\n\nBut many challenges await the new republic in the balkans, with the different people wanting the nation to be a part of Croatia or Serbia, nevertheless the Republic is now proclaimed. A new beacon of liberty in the balkans."
 bosnia.3.a:0 "Long Live Free Bosnia!"

 bosnia.4.t:0 "The First Congress"
 bosnia.4.d:0 "With the first congress being organized, the party members are starting to talk about the industrialisation of the new republic.\n\nThe first delegation suggests to do an Agrarian reform, that industrialisation will not go so well because of the agrarian state Bosnia has always been, reforming the agrarian society would be a good choice for the farmers.\n\nThe second delegation suggests for industrialisation, that Bosnia can only catch up to other powers when its industry becomes more powerful, and that the agrarian society will learn to eventually assimilate in the new act of industrialisation."
 bosnia.4.a:0 "Agrarian Reforms are the best for our people"
 bosnia.4.b:0 "Industrialisation is never a bad idea"

 bosnia.5.t:0 "Construction on the Parliament has begun"
 bosnia.5.d:0 "Our request of building a parliament has begun, it is expected to be finished in less than a year"
 bosnia.5.a:0 "Excellent"

 bosnia.6.t:0 "Parliament Constructed"
 bosnia.6.d:0 "The Bosnian Democratic Parliament has finished construction, the workers have gotten their fair pay and the politicians are now taking places inside it"
 bosnia.6.a:0 "A new chapter in Bosnian history is here"

 bosnia.7.t:0 "Corruption in the Parliament"
 bosnia.7.d:0 "Ever since it was established, some of our poiticians have resolved to bribery and overall corruption to get rich and influence others for their own benefits, Mehmed Spaho has suggested a crackdown on corruption but that act needs to get approved, but with the corruption taking place, it is highly unlikely."
 bosnia.7.a:0 "We will deal with them later"

 bosnia.8.t:0 "Parliament Passes Corruption Policy"
 bosnia.8.d:0 "Spaho's plan of ending corruption in the Bosnian Parliament has been put into effect, the Government hopes that this new policy will expose the politicians who are corrupted and cease corruption overall."
 bosnia.8.a:0 "Let the Hunt Begin!"

 bosnia.9.t:0 "Lower Rates of Corruption"
 bosnia.9.d:0 "Ever since the new policy has been put into effect 75 days ago, corruption is at an alltime low in the parliament, the Governemnt has acknowledged the lower rates of corruption and is slowly preparing for new ways to stabilize it."
 bosnia.9.a:0 "Excellent"

 bosnia.10.t:0 "Suspected Corrupt Politicians Arrested"
 bosnia.10.d:0 "A few politicians have been arrested this morning with charges of corruption, before and after the new corruption policy was enacted."
 bosnia.10.a:0 "The rats have been exposed"

 bosnia.11.t:0 "Džafer Kulenović Captured"
 bosnia.11.d:0 "Džafer Kulenović was today captured in his home by the Bosnian Militia, all the evidence pointed at him being the one who organized the corruption in the parliament, it was also revealed he had significent ties with the Croatian Ustaše and planned on helping them by promoting Croatian National Propaganda across the nation"
 bosnia.11.a:0 "May he rot in Prison!"

 bosnia.12.t:0 "The Sarajevo Rally"
 bosnia.12.d:0 "With the rise of Bosniak Nationalism across the nation, many who are in support of a Bosniak State rallied today in Sarajevo to show their support for the fascist NSB party. Those who were involved handed papers about the opressed history of the Bosniaks as well as having their voices be heard loud and clear.\n\nBut it is also no secret that this rally, as well as the increased support for the NSB Party, has upset many Croats and Serbs living in the region for their safety. "
 bosnia.12.a:0 "May the Voice of the Opressed be Heard Loud and Clear!"

 bosnia.13.t:0 "The Song of the Bosniaks"
 bosnia.13.d:0 "With the National Restoratio nof the Bosniak people coming along, the idea of a new anthem was brought up by the Bosniak Council, and the composers in the nation swiftly got to work.\n\nOne composer by the name of Mirza Demirović came up with a composition, as well as lyrics, that sing about the great struggle of the Bosniak People, and how in the end we rose from the ashes like a phoenix. This was accepted by the Bosniak Council and is currently our new national anthem."
 bosnia.13.a:0 "A New era for Bosniaks is here"

 bosnia.14.t:0 "Serbian Memorials"
 bosnia.14.d:0 "Ever since the Serbs settled in the Bosnian region, many memorials depicting Serbian war heroes were erected in local towns and Cities. While these Memorials may hold a lot of significance to the Serbian Population of our nation, it also reminds many Bosniaks of the dark past the region, as well as its people, had with some of these war heroes.\n\nThe Bosniak Council is suggesting for those Serbian Memorials and Statues to be torn down as a sign of Bosniak superiority in the nation. But there is no doubt that this action will upset the Serbian Population."
 bosnia.14.a:0 "Smash them to Bits!"
 bosnia.14.b:0 "Leave them be, they cannot hurt anyone."

 bosnia.15.t:0 "Unrest Among the Serbian Population"
 bosnia.15.d:0 "With the recent Anti-Serbian rhetoric displayed by the new Fascist government, the Serbian people living in Bosnia had finally mustered up the courage to go against the new Government. Protests in Serb majority villages were organized, as well as a few Pro Chetnik rallies as well. Since the Serbs make up 46% of the population, their opposition towards the government will be a problem to keep up public support."
 bosnia.15.a:0 "We will get to them eventually"

 bosnia.16.t:0 "Bosnia Requests ownership of Albania"

 bosnia.17.t:0 "Italy transfers ownership of Albania"
 bosnia.17.d:0 "The Italian government has today sent an official decleration of Italian troops moving out of the occupied state, and for it to be transfered into out hands. The Italian government stated that Albania was not that important to them in terms of resources, and with the constant resistance to occupiation, they were spending more resources in the area, than producing.\n\nSo as of today, the Albanian land belongs to our Bosnian State."
 bosnia.17.a:0 "A day to remember"

 bosnia.18.t:0 "The Serbian Question"
 bosnia.18.d:0 "The council has finally passed their act on ways to deal with the Serbian population in our region, but it is split in opinion on what act to pass.\n\nThe government could start the destruction of Serbian culture in our land, and assimilate the Serbs to the point where they will have to, by law, refer to themselves as 'Orthodox Bosniaks'. This move could ensure the unity we have always been searching for.\n\nBut another part of the council disagrees, stating that they are too rooted in their nationalism to submit, and that it was time to return everything they had been doing in the region to Bosniaks, to use the Serbs as free labour instead of assimilation, that this way it will lead to more benefits. But there is no doubt that this choice will lead to the great democratic powers responding negatively, a swell as have an impact on the stability of the region."
 bosnia.18.a:0 "There are no 'Serbs', only Orthodox Bosniaks!"
 bosnia.18.b:0 "Strip them of their citizenship and put them all to work!"

 bosnia.19.t:0 "Serbian Orthodox Churches"
 bosnia.19.d:0 "One of the main roots of Serbian Nationalism are the Orthodox Churches and its bishop who glorify the Serbian people as well as the nation. These churches existed for centuries in our land, and there were always suspicion of them fueling Serbian nationalism. In order to assimilate the Serbian population, we will have to implement new reforms for these Orthodox Churches."
 bosnia.19.a:0 "Replace the Serbian bishops with Bosniak ones"
 bosnia.19.b:0 "Completely re-model them in our state's fashion"

 bosnia.20.t:0 "Reformed Education System"
 bosnia.20.d:0 "During the reign of Austria-Hungary, as well as Yugoslavia, children in school were taught both the latin and the cyrillic alphabet, as well as Serbian history for Serbian children.\n\nWith the new education system introduced with the Assimilation act, the cyrillic alphabet was completely banned from being taught inm public schools, and the latin alphabet was the primary alphabet to be taught. Lessons on Serbian history will be banned and Serbian children will be introduced to Bosniak Patriotism, and only learn the history of the Bosnian region."
 bosnia.20.a:0 "The children are our future, after all"

 bosnia.21.t:0 "Remaining Serbian Nationalists Executed"
 bosnia.21.d:0 "Even with the Chetnik paramilitary wiped out, many Serbs still supported Serbian Nationalism, even if we implemente dthe assimilation act. Our secre tpolice worked day and night, rooting out any remaining Serbian Nationalists in our land, and every day at least three were executed.\n\nToday, the last remaining nationalists were publicly executed in the Bosnian countryside, and with their deaths, Serbian nationalism has been put down in our glorious land."
 bosnia.21.a:0 "The hunt for the scum is finally over"

 bosnia.22.t:0 "The Fate of Istanbul"
 bosnia.22.d:0 "The conquest of Istanbul was a historic moment for generations to come, and recently a few councilmen approached us with an intriguing suggestion. Considering the fact that the Turks slaughtered the entire Bosnian Royal family in 1463, they think that the best way to make sure that they are never forgotten, is to re-name the city in their name."
 bosnia.22.a:0 "We shall honor the fathers of our nation"
 bosnia.22.b:0 "There is no need"

 bosnia.23.t:0 "The Tuzla Conference"
 bosnia.23.d:0 "Today the Bosnian delegation has arrived in the city of Tuzla to discuss a very important part of stabilizing the Bosnian region. The Croats and Serbs have been causing some issues with their support for the Chetnik and Ustasa movement, and there is no doubt that this would also influence our politics in the near future. The delegation has given the green light to prepare operations against these movements and supress them the best we can."
 bosnia.23.a:0 "Excellent"

 bosnia.24.t:0 "Chetnik Meeting Busted"
 bosnia.24.d:0 "Our secret police was keeping a close eye on many chetnik supporters throughout the country, to try and gather any useful information on them and the movement. After careful observations, we manage to locate a secret meeting that would be happening in the city of Prijedor. On the night of the meeting, our police stormed the building and arrested sixteen chetniks, and they would be interrogated soon enough for any more secrets the movement is keeping."
 bosnia.24.a:0 "We can only hope one of them will squeal soon"

 bosnia.25.t:0 "A loose lip"
 bosnia.25.d:0 "After the raid on a chetnik meeting recently, our interrogation force started questioning the participants of that meeting on any more intel on the whereabouts of other chetnik troops. After some brutal beatings one participant spoke up. There is a secret bunker near the city of Banja Luka, which is also the main base of the chetnik movement in Bosnia."
 bosnia.25.a:0 "Let us prepare for the great raid"

 bosnia.26.t:0 "The Chetnik Bunker Raid"
 bosnia.26.d:0 "With the information we gathered from one of the meeting participants, our army prepared to storm the Banja Luka secret bunker, the HQ of the chetnik forces. The raid was a success, numerous chetnik forces have been killed as well as many prisoners taken. But the leader of the chetnik forces managed to escape while the raid was happening. Overall, the fall of the HQ will bring more peace and stability to our region"
 bosnia.26.a:0 "We will get him eventually"

 bosnia.27.t:0 "Draža Mihailović Captured"
 bosnia.27.d:0 "After the Banja Luka bunker raid, the leader of the chetnik movement in Bosnia, Draža Mihailović, went into hiding in the city of Zenica. It did not take long to locate his position in Zenica due to all the clues he left behind in the bunker. The secret police stormed an old apartment in Zenica wher ehe was hiding at, and arrested him. With the fall of the bunker, and their leader arrested, the chetnik movement has disbanded due to them not being organized enough.\n\nBut the threat is not over yet, for Mihailović is still awaiting trial at the Sarajevo supreme court. "
 bosnia.27.a:0 "The biggest threat to the region has now been stopped"

 bosnia.28.t:0 "The Trial of Draža Mihailović"
 bosnia.28.d:0 "The day of the trial is finally here. Draža Mihailović, who was the leader and organizer fo the Chetnik movement in Bosnia, stands trial for treason against the nation, as well as Terrorism. The public is split on his sentence, half of the population wants him to rot in jail for the rest fo his life, while the other claim that "the scum must be put down". "
 bosnia.28.a:0 "We will let him rot in Jail"
 bosnia.28.b:0 "Jail is too good for this monster, he shall be executed!"

 bosnia.29.t:0 "Đuro Pucar's Speech"
 bosnia.29.d:0 "With the slow but steady rise of the communist ideology in our nation, the communist party's leader, Đuro Pucar, decided that it would be an ideal opportunity to hold a speech in Sarajevo among the more rural parts of the capital.\n\nHe first started off by glorifying the poor working class of Bosnia, calling them brave for holding through these tough times of capitalism. Then he went on to acknowledge the rise of nationalism among the three ethnic groups of the nation, stating that instead of one ethnicity ruling over the other, that all people should be united under one banner and lead the nation under one idea and ideology.\n\nBecause of his efforts, the general population has shown to be a lot more sympathetic to the communist party."
 bosnia.29.a:0 "Intriguing"

 bosnia.30.t:0 "Local Communist Paramilitaries Forming in Towns"
 bosnia.30.d:0 "Due to the ethnic tensions in our nation, the local population in many towns in Bosnia started forming local paramilitary forces made up of individuals who follow the Đuro's ideology. The forces are claimed to help local villages from raids organized by nationalist groups from the three people, due to them not having faith in the current capitalist government of handling these groups and protecting the locals."
 bosnia.30.a:0 "We Will Handle Them Later"

 bosnia.31.t:0 "March on Sarajevo"
 bosnia.31.d:0 "The Communist party of Bosnia was gaining many followers day after day, with the promises of more rights to the poor and the annihilation of nationalism so that all three people could work together for a better tomorrow. Not wanting to wait for the next election, Đuro Pucar started planning a march into the capital using the local Paramilitary forces.\n\nAt dawn, Pucar lead the paramilitary forces personally towards the capital, while individuals who could not join the paramilitaries, would start organizing communist marches and rallies in the city. It did not take long for the paramilitary forces to enter the capital, with thousands of supporters cheering them on. A small number of clashes occured between the forces and the local police, but the police were not able to overpower paramilitary forces.\n\nThe Paramilitary forces alongside its supporters surrounded the government and parliament, demanding for the current gvernment to step down and for the Communists to assume power. Since this attack happened so fast, the military was not going to arrive in hours, and until they arrive all of the politicans would have been dead.\n\nWith no other choices left, Mehmed Spaho announced the resignation of the government and that the Communist party would become the new ruling party. Hundreds of thousands of people cheered in Sarajevo, as well as in other local towns. This is going to be an important day for the people of Bosnia, and the nation."
 bosnia.31.a:0 "Glory To The Everlasting Revolution!" 

 bosnia.32.t:0 "Conversion of the Saint Sava Orthodox Cathedral into a Mosque "
 bosnia.32.d:0 "The Serbian capital of Belgrade has once again fallen in the name of Islam. This time, we should cement our reign over the city by learning from what the Ottoman Empire did after the fall of Constantinople. In the center of the city, lies the sacred Saint Sava Cathedral, and converting it into a Mosque would cement another decade of Islamic rule in the city."
 bosnia.32.a:0 "It Shall Be A Glorious Mosque!"
 bosnia.32.b:0 "Leave it Be"

 BOS_illyrian_invitation_tt:0 "Albania will be invited to join the Illyrian Union. If they accept, every member guarantees their independence. If they refuse, we decide what happens next."
 bosnia.200.t:0 "Invitation to the Illyrian Union"
 bosnia.200.d:0 "Bosnia has invited us to join the Illyrian Union. Members would guarantee our independence, but we would be bound to their alliance."
 bosnia.200.a:0 "Accept the invitation"
 bosnia.200.b:0 "Decline"
 bosnia.201.t:0 "Albania Rejects our Invitation"
 bosnia.201.d:0 "Albania has refused to join the Illyrian Union. We can leave them to their own affairs or make them join by force."
 bosnia.201.a:0 "Let them stand alone"
 bosnia.201.b:0 "They will join by force"

 bosnia.202.t:0 "Bosnia Demands Sanjak"
 bosnia.202.d:0 "The Bosnian government has delivered an extraordinary diplomatic demand. They insist that Montenegro be surrendered to Bosnia, citing historical claims and their supposed right to the territory. Accepting such a demand would be a humiliating blow to our national sovereignty."
 bosnia.202.a:0 "Peace is worth the price."
 bosnia.202.b:0 "The Muslim's demands are ludicrous!" 

 bosnia.203.t:0 "The Future of Dalmatia"
 bosnia.203.d:0 "Dalmatia has secured its freedom with our help. But freedom comes at a cost, and the question is what price will the new leaders of Dalmatia pay for our past and future support."
 bosnia.203.a:0 "Dalmatia will be under Sarajevo's influence"
 bosnia.203.b:0 "Dalmatia will be integrated into Bosnia"

 #News

 bosnia_news.1.t:0 "The Fall of Belgrade"
 bosnia_news.1.d:0 "Belgrade, a city that survived so many wars, from the Ottomans until the Austro Hungarians, has today fallen into the hands of Bosnian soldiers. The army first launched an artillery strike on the city, almost completely destroying it before moving in with the troops, the Serbian soldiers established defense posts before the break in, but they fell easily when the break in began. The remaining Serbian soldeirs fled into the hills outside the city, the remaining ones were either captured or killed in warfare, a Bosnian soldier climbed atop the almost destroyed Saint Sava Orthodox cathedral and put up a Bosnian flag over it, on the ground soldiers were cheering and shouting out war cries."
 bosnia_news.1.a:0 "What will this mean for the Serbs?"
 bosnia_news.1.b:0 "Who are the heavenly people now?"
 bosnia_news.1.c:0 "This is a disaster!"
 bosnia_news.1.e:0 "This is a disaster!"

 #\n\n

 
