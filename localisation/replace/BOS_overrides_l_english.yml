# --- events
 bosnia.1.t:0 "Chetniks raid factory"
 bosnia.1.d:0 "The chetniks have raided a local factory in our country, they broke some machines and damaged the building"
 bosnia.1.a:0 "Damnation"
 bosnia.2.t:0 "Murder in a village"
 bosnia.2.d:0 "The chetnik movement, in their aim for a Serbian Bosnia, killed a young Bosniak in a village, his body was found in the woods and locals are getting scared"
 bosnia.2.a:0 "They will pay for this"
 bosnia.3.t:0 "The Fall of Belgrade"
 bosnia.3.d:0 "Belgrade, a city that survived so many wars, from the Ottomans until the Austro Hungarians, has today fallen into the hands of Bosnian soldiers. The army first launched an artillery strike on the city, almost completely destroying it before moving in with their troops, the Serbian soldiers established defense posts before the break in, but it was almost as useless, the remaining Serbian soldeirs fled into the hills outside the city, the remaining ones were either captured or killed in the warfare, a Bosnian soldier climbed up the almost destroyed Saint Sava Orthodox cathedral and put up a Bosnian flag over it, on the ground soldiers were cheering and shouting out war cries."
 bosnia.4.a:0 "What will this mean for the Serbs?"
 bosnia.5.b:0 "Who are the heavenly people now?"
 bosnia.6.c:0 "This is a disaster!"
 bosnia.7.d:0 "This is a disaster!"

